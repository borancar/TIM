[project]
name = "tim-reconstruction"
version = "0.1.0"
description = "Reverse engineering and C reconstruction of The Incredible Machine (Dynamix/Sierra, 1993)"
requires-python = ">=3.11"
dependencies = [
  "dos-emulator @ git+https://github.com/borancar/dos_emulator@548df402fbbd3edd2a3f256763661a83d866397b",
  "capstone>=5.0",
  "unicorn>=2.0",
  "pygame-ce>=2.4",
  "numpy",
  # `tools/dgrules.py` parses the port's own C to find what the DGROUP structs
  # have not swallowed yet. It is a parse and not a regex because both rules
  # are about shape: `DG16(0x3894)` and `DG16((uint16_t)(part + 0x0c))` are the
  # same three characters and completely different problems.
  "tree-sitter>=0.21",
  "tree-sitter-c>=0.21",
]

[tool.uv]
package = false
