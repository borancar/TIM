[sdl]
windowresolution=original

[render]
scaler=none

# A fixed speed, so one run is comparable with the last. `auto` and `max` both
# track whatever the host is doing, and this game's pacing follows the machine:
# measured, DOSBox's music went from an envelope period of 0.406s at 8000
# cycles to 0.075s at 30000 and 0.046s at `max` - a fivefold difference in how
# fast the game runs, and nothing to do with the game.
#
# **`cycles`, not `cpu_cycles`, and knowingly.** DOSBox deprecates this name and
# points at `cpu_cycles`, `cpu_cycles_protected` and `cpu_throttle`. The old one
# is used here because it is the one observed to work - the three tempo figures
# above are what that observation is - and four attempts to confirm the new name
# binds came back with nothing: the effective value is not logged at this
# verbosity, and `config -get` blocks on the console. Worth moving once somebody
# can show the new setting taking effect rather than merely being accepted.
[cpu]
cycles=fixed 10000
